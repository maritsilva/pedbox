# Provision only after reviewing the current Render quotation and setting secrets.
services:
  - type: web
    name: pedbox
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    disk:
      name: pedbox-uploads
      mountPath: /app/.data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DEV_AUTH
        value: 'false'
      - key: UPLOAD_DIR
        value: /app/.data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: pedbox-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false

databases:
  - name: pedbox-db
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: '17'
    diskSizeGB: 5
    ipAllowList: []
