services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DEV_AUTH: 'false'
      TRUST_PROXY_HOPS: '1'
      DATABASE_URL: postgresql://pedbox:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/pedbox
      UPLOAD_DIR: /app/.data/uploads
    volumes:
      - uploads:/app/.data/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedbox
      POSTGRES_USER: pedbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pedbox -d pedbox']
      interval: 5s
      timeout: 5s
      retries: 20
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  database:
  uploads:
  certificates:
  caddy_config:
